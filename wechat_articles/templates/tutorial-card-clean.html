<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>卡片式教程清单风</title></head>
<body>
<section style="max-width:677px;margin:0 auto;background:#fff;font-family:'PingFang SC',-apple-system,sans-serif;color:#111827;line-height:1.92;">
  <section style="padding:30px 24px 22px;border:1px solid #e5e7eb;border-radius:18px;margin-bottom:22px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.04);">
    <p style="font-size:11px;letter-spacing:2px;font-weight:800;color:#6b7280;margin:0 0 10px;">GUIDE</p>
    <p style="font-size:28px;line-height:1.12;font-weight:900;margin:0 0 10px;">标题</p>
    <p style="font-size:14px;line-height:1.75;color:#6b7280;margin:0;">适合配置指南、操作步骤、清单型文章</p>
  </section>

  <section style="padding:0 20px 20px;">
    <section style="background:#f9fafb;border-radius:14px;padding:16px 18px;margin-bottom:22px;border:1px solid #e5e7eb;">
      <p style="font-size:13px;color:#111827;margin:0 0 8px;font-weight:800;">你会得到：</p>
      <p style="font-size:13px;color:#4b5563;margin:0;line-height:1.85;">- 一套步骤<br>- 一组配置<br>- 一个结果</p>
    </section>

    <section style="background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.03);">
      <p style="font-size:17px;font-weight:900;margin:0 0 10px;">步骤 1</p>
      <p style="font-size:14px;line-height:1.9;margin:0 0 14px;">先做第一步。</p>
      <section style="text-align:center;"><img src="图片URL" style="max-width:100%;border-radius:12px;" /></section>
    </section>

    <section style="background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.03);">
      <p style="font-size:17px;font-weight:900;margin:0 0 10px;">步骤 2</p>
      <p style="font-size:14px;line-height:1.9;margin:0;">再做第二步。</p>
    </section>

    <section style="background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.03);">
      <p style="font-size:17px;font-weight:900;margin:0 0 10px;">步骤 3</p>
      <p style="font-size:14px;line-height:1.9;margin:0;">最后做第三步。</p>
    </section>

    <section style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:14px;padding:16px 18px;margin-top:20px;">
      <p style="font-size:14px;line-height:1.85;color:#065f46;margin:0;"><strong>最后一句：</strong>把关键提醒、关键坑、关键结果写在这里。</p>
    </section>
  </section>
</section>
</body>
</html>
