<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>极简教程风</title></head>
<body>
  <section style="max-width:677px;margin:0 auto;background:#fff;font-family:'PingFang SC',-apple-system,sans-serif;color:#111827;line-height:1.9;">
    <section style="padding:28px 24px 20px;border-bottom:1px solid #f3f4f6;">
      <p style="font-size:11px;letter-spacing:2px;font-weight:700;color:#6b7280;margin:0 0 10px;">GUIDE</p>
      <p style="font-size:28px;line-height:1.15;font-weight:900;margin:0 0 10px;">标题</p>
      <p style="font-size:14px;line-height:1.75;color:#6b7280;margin:0;">适合配置指南、操作步骤、清单型内容</p>
    </section>

    <section style="padding:20px;">
      <p style="font-size:14px;line-height:1.95;margin:0 0 20px;text-align:justify;">开头直接说清楚：这篇文章解决什么问题，适合谁看。</p>
      <section style="background:#f9fafb;border-radius:12px;padding:16px 18px;margin-bottom:22px;border:1px solid #e5e7eb;">
        <p style="font-size:13px;color:#374151;margin:0 0 8px;font-weight:700;">你会得到：</p>
        <p style="font-size:13px;color:#4b5563;margin:0;line-height:1.8;">- 一套步骤
- 一组配置
- 一个结果</p>
      </section>

      <p style="font-size:18px;font-weight:900;margin:0 0 12px;">步骤 1</p>
      <p style="font-size:14px;line-height:1.95;margin:0 0 18px;">先做第一步。</p>
      <section style="text-align:center;margin-bottom:20px;"><img src="图片URL" style="max-width:100%;border-radius:12px;"/></section>
      <p style="font-size:18px;font-weight:900;margin:0 0 12px;">步骤 2</p>
      <p style="font-size:14px;line-height:1.95;margin:0 0 18px;">再做第二步。</p>
      <p style="font-size:18px;font-weight:900;margin:0 0 12px;">步骤 3</p>
      <p style="font-size:14px;line-height:1.95;margin:0 0 18px;">最后做第三步。</p>

      <section style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:16px 18px;margin-top:24px;">
        <p style="font-size:14px;line-height:1.8;color:#065f46;margin:0;"><strong>最后一句：</strong>把关键结果、关键提醒、关键坑写在这里。</p>
      </section>
    </section>
  </section>
</body>
</html>
