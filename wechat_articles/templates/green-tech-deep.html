<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>绿色科技深度风</title>
</head>
<body>
  <section style="max-width:677px;margin:0 auto;background:#fff;font-family:'PingFang SC',-apple-system,BlinkMacSystemFont,sans-serif;color:#374151;line-height:1.85;letter-spacing:.3px;">
    <section style="margin:0 0 28px;background:#fff;border:1.5px solid rgba(5,150,105,.15);border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06);">
      <section style="padding:32px 28px 24px;">
        <section style="display:flex;align-items:center;gap:8px;margin-bottom:24px;">
          <span style="width:6px;height:6px;background:#059669;border-radius:50%;"></span>
          <span style="font-size:11px;font-weight:700;letter-spacing:3px;color:#059669;">DEEP DIVE</span>
          <span style="flex:1;height:1px;background:linear-gradient(to right,rgba(5,150,105,.12),transparent);"></span>
          <span style="font-size:10px;color:#d1d5db;font-weight:600;">DATE</span>
        </section>
        <p style="font-size:15px;color:#d1d5db;margin:0 0 6px;text-decoration:line-through;">旧认知 / 旧问题</p>
        <p style="font-size:28px;font-weight:900;color:#111827;margin:0;line-height:1.08;">主标题第一行</p>
        <p style="font-size:28px;font-weight:900;color:#059669;margin:0 0 14px;line-height:1.08;">主标题第二行高亮</p>
        <div style="width:52px;height:3px;background:linear-gradient(to right,#059669,#34d399);border-radius:2px;margin-bottom:12px;"></div>
        <p style="font-size:13px;color:#9ca3af;margin:0;">副标题 / 一句话摘要</p>
      </section>
      <section style="background:linear-gradient(135deg,#059669,#10b981);padding:12px 28px;display:flex;justify-content:space-between;gap:12px;">
        <p style="font-size:12px;color:rgba(255,255,255,.92);margin:0;font-weight:600;">核心关键词 / 文章定位</p>
        <p style="font-size:12px;color:#fff;margin:0;font-weight:700;">科技深度</p>
      </section>
    </section>

    <section style="padding:0 20px 20px;">
      <p style="margin-bottom:18px;font-size:14px;line-height:1.95;text-align:justify;">导语段落，第一屏要尽量把冲突和结论说出来。<span style="background:linear-gradient(120deg,#FDE68A 0%,rgba(255,255,255,0) 100%);padding:0 4px;border-radius:2px;font-weight:600;color:#111827;">重点句子高亮</span></p>
      <section style="text-align:center;margin-bottom:24px;"><img src="图片URL" style="max-width:100%;border-radius:16px;"/></section>
      <section style="background:#fff;border:1px dashed #bbf7d0;border-radius:8px;padding:14px 16px;margin-bottom:24px;text-align:center;">
        <p style="font-size:14px;color:#374151;margin:0;line-height:1.7;">一句话说清楚：<strong style="color:#059669;border-bottom:3px solid #fde68a;font-size:15px;">核心观点</strong></p>
      </section>
    </section>

    <section style="padding:0 20px 28px;">
      <p style="font-size:18px;font-weight:900;color:#111827;margin:0 0 14px;">01｜章节标题</p>
      <p style="font-size:14px;line-height:1.95;margin:0 0 18px;text-align:justify;">正文内容，适合用于项目分析、产品拆解、趋势文章。</p>
      <section style="text-align:center;margin-bottom:24px;"><img src="图片URL" style="max-width:100%;border-radius:12px;"/></section>
      <p style="font-size:18px;font-weight:900;color:#111827;margin:0 0 14px;">02｜章节标题</p>
      <p style="font-size:14px;line-height:1.95;margin:0 0 18px;text-align:justify;">继续展开第二部分，适合长文节奏。</p>
    </section>

    <section style="margin:0 20px 24px;background:radial-gradient(circle at center,#f9fafb 0%,#fff 100%);border:1px solid #e5e7eb;border-radius:16px;padding:28px 20px;text-align:center;">
      <p style="font-size:13px;font-weight:700;color:#111827;margin:0 0 12px;">如果这篇对你有帮助，欢迎点个赞和在看。</p>
      <p style="font-size:10px;color:#9ca3af;letter-spacing:1px;margin:0;">THANKS FOR READING</p>
    </section>
  </section>
</body>
</html>
